<div class="toast-host" *ngIf="toastService.toasts.length">
  <div class="app-toast" *ngFor="let t of toastService.toasts" [class]="t.kind">
    <div class="flex-grow-1">{{ t.message }}</div>
    <button
      type="button"
      class="btn-close btn-sm"
      (click)="toastService.dismiss(t.id)"
    ></button>
  </div>
</div>

<div class="app-frame" *ngIf="isLoggedIn(); else guestView">
  <aside class="side-nav">
    <div class="side-brand">
      <span class="brand-mark" aria-hidden="true">A</span>
      <div>
        <div class="brand-name">Agrosole</div>
        <div class="brand-tag">Smart Pest Control System</div>
      </div>
    </div>

    <nav class="side-menu" aria-label="Main navigation">
      <ng-container *ngFor="let group of navigationGroups">
        <p class="menu-label">{{ group.label }}</p>
        <a
          *ngFor="let item of group.items"
          [routerLink]="item.route"
          routerLinkActive="active"
        >
          <i [class]="'bi ' + item.icon" aria-hidden="true"></i>
          <span>{{ item.label }}</span>
        </a>
      </ng-container>
    </nav>
  </aside>

  <div class="main-pane">
    <header class="top-bar">
      <div>
        <div class="top-greeting">{{ displayName || "Administrator" }}</div>
        <div class="top-meta" *ngIf="userId">User ID · {{ userId }}</div>
      </div>
      <div class="top-actions">
        <button
          type="button"
          class="btn btn-outline-ink btn-sm"
          (click)="logOut()"
        >
          <i class="bi bi-box-arrow-right"></i> Sign out
        </button>
      </div>
    </header>

    <main class="content-pane">
      <router-outlet></router-outlet>
    </main>
  </div>
</div>

<ng-template #guestView>
  <div class="guest-shell">
    <router-outlet></router-outlet>
  </div>
</ng-template>
